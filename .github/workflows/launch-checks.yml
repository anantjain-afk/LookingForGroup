name: Launch checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lfg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lfg_test
      LFG_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lfg_test_browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci && npm run db:generate && npm test
        working-directory: server
      - run: npm ci && npm run lint && npm run build
        working-directory: client
      - run: createdb -h 127.0.0.1 -U postgres lfg_test_browser
        env:
          PGPASSWORD: postgres
      - run: npx playwright install --with-deps chromium --only-shell && npm run test:e2e
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: client/test-results/
